<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Print3D | Custom 3D Printing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg:#0b0d14; --card:#15192b; --text:#e9e9f1; --muted:#9aa0b4;
    --primary:#6c63ff; --accent:#25D366;
}
.light { --bg:#f4f6fb; --card:#fff; --text:#1a1a1a; --muted:#555; }

body{
    margin:0;font-family:"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);
}

/* NAV */
nav{
    position:fixed;top:20px;left:50%;
    transform:translateX(-50%);
    display:flex;gap:20px;font-weight:bold;
}
nav a{color:var(--text);text-decoration:none}

/* HEADER */
header{
    height:100vh;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    text-align:center;
}

/* BUTTON */
.btn{
    padding:10px 18px;
    background:linear-gradient(135deg,var(--accent),#6dff9c);
    border-radius:10px;color:#000;font-weight:600;
    text-decoration:none;
}

/* SECTION */
section{padding:80px 20px;text-align:center;}

/* 🔍 SEARCH BAR (FIXED) */
.search-box{
    display:flex;
    justify-content:center;
    margin:30px 0;
}

#searchInput{
    width:320px;
    padding:14px;
    border-radius:30px;
    border:none;
    outline:none;
    font-size:16px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

/* CARD */
.card{
    background:var(--card);
    border-radius:15px;
    overflow:hidden;
    padding-bottom:15px;
    transition:0.3s;
}
.card:hover{transform:scale(1.05)}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card h3{margin:10px 0;}
.price{font-weight:bold;margin:10px 0;}
</style>
</head>

<body>

<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
</nav>

<header id="home">
<h1>Print3D</h1>
<p>Custom 3D Printing</p>
<a class="btn" href="#products">See Products</a>
</header>

<section id="products">
<h2>Our Products</h2>

<!-- 🔍 SEARCH BAR -->
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
</div>

<div class="products">

<!-- INFINITY CUBE -->
<div class="card">
<img src="infinitycube.jpg">
<h3>Infinity Cube</h3>
<div class="price">₹79</div>
<a class="btn" href="https://wa.me/919823847358?text=Infinity%20Cube%2079">Buy</a>
</div>

<!-- FOX -->
<div class="card">
<img src="Fox.jpg">
<h3>Fox Figurine</h3>
<div class="price">₹30</div>
<a class="btn" href="https://wa.me/919823847358?text=Fox%2030">Buy</a>
</div>

<!-- BENCHY -->
<div class="card">
<img src="Benchy.jpg">
<h3>Benchy</h3>
<div class="price">₹30</div>
<a class="btn" href="https://wa.me/919823847358?text=Benchy%2030">Buy</a>
</div>

<!-- SPIDER -->
<div class="card">
<img src="spider.jpg">
<h3>Spider Model</h3>
<div class="price">₹25</div>
<a class="btn" href="https://wa.me/919823847358?text=Spider%2025">Buy</a>
</div>

<!-- DINOSAUR -->
<div class="card">
<img src="Dinosour.jpg">
<h3>Flexible Dinosaur</h3>
<div class="price">₹50</div>
<a class="btn" href="https://wa.me/919823847358?text=Dinosaur%2050">Buy</a>
</div>

</div>
</section>

<script>
function searchProducts(){
 let input=document.getElementById("searchInput").value.toLowerCase();
 let cards=document.querySelectorAll(".card");

 cards.forEach(card=>{
   let text=card.innerText.toLowerCase();
   card.style.display = text.includes(input) ? "block" : "none";
 });
}
</script>

</body>
</html>
