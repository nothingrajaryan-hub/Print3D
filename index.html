<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Print3D | Custom 3D Printing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg:#0b0d14; --card:#15192b; --text:#e9e9f1; --muted:#9aa0b4;
    --primary:#6c63ff; --secondary:#00e5ff; --accent:#25D366;
}
.light { --bg:#f4f6fb; --card:#fff; --text:#1a1a1a; --muted:#555; }

body{
    margin:0;font-family:"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);
    scroll-behavior:smooth;transition:0.4s;overflow-x:hidden;
}

/* Cursor */
.cursor{
    width:20px;height:20px;border-radius:50%;
    position:fixed;pointer-events:none;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(108,99,255,0.7), rgba(108,99,255,0));
    mix-blend-mode:screen;z-index:9999;
}

/* Toggle */
.toggle{
    position:fixed;top:20px;right:20px;
    background:var(--card);border:none;color:var(--text);
    padding:10px 14px;border-radius:10px;
    cursor:pointer;z-index:100;
}

/* Nav */
nav{
    position:fixed;top:20px;left:50%;
    transform:translateX(-50%);
    display:flex;gap:25px;font-weight:bold;z-index:100;
}
nav a{color:var(--text);padding:6px 10px;border-radius:6px;transition:0.3s;}
nav a:hover{background:var(--primary);}

/* Hero */
header{
    min-height:100vh;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    background:radial-gradient(circle at top,#1c1f3a,transparent),
               linear-gradient(120deg,#0b0d14,#0f1230);
}

.logo{width:260px;max-width:90%;}

/* Buttons */
.btn{
    display:inline-block;padding:8px 14px;
    background:linear-gradient(135deg,var(--accent),#6dff9c);
    color:#000;border-radius:8px;font-weight:600;
}

/* Sections */
section{padding:80px 20px;}

/* SMALLER CARDS */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:40px;
}

.card{
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    transition:0.4s;
}
.card:hover{
    transform:translateY(-8px) scale(1.02);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card-content{padding:16px;}
.card h3{font-size:1.2rem;}
.details{color:var(--muted);font-size:0.9rem;margin-top:6px;}
.price{margin:10px 0;font-weight:bold;}

/* Contact */
form{display:flex;flex-direction:column;max-width:400px;margin:auto;}
input,textarea{padding:10px;margin:8px 0;border-radius:6px;border:none;}
footer{text-align:center;padding:30px;color:var(--muted);}

</style>
</head>

<body>

<div class="cursor"></div>
<button class="toggle" onclick="toggleTheme()">🌙 / ☀️</button>

<nav>
  <a href="#home">Home</a>
  <a href="#products">Products</a>
  <a href="#contact">Contact</a>
</nav>

<header id="home">
<h1>Print3D</h1>
<p>Modern Custom 3D Printing & Prototyping</p>
<a class="btn" href="#products">See Products</a>
</header>

<section id="products">
<h2>Our Products</h2>

<div class="products">

<!-- FOX (UPDATED PRICE ₹30) -->
<div class="card">
<img src="Fox.jpg">
<div class="card-content">
<h3>Fox Figurine</h3>
<div class="details">6cm x 6cm, lightweight and cute</div>
<div class="price">₹30</div>
<a class="btn" href="https://wa.me/919823847358?text=Hi%2C%20I%20am%20interested%20in%20Fox%20Figurine%20(%E2%82%B930)" target="_blank">WhatsApp</a>
</div>
</div>

<!-- BENCHY -->
<div class="card">
<img src="Benchy.jpg">
<div class="card-content">
<h3>Benchy</h3>
<div class="details">5cm x 6.5cm test model</div>
<div class="price">₹15</div>
<a class="btn" href="https://wa.me/919823847358?text=Hi%2C%20I%20am%20interested%20in%20Benchy%20(%E2%82%B915)" target="_blank">WhatsApp</a>
</div>
</div>

<!-- SPIDER -->
<div class="card">
<img src="spider.jpg">
<div class="card-content">
<h3>Spider Model</h3>
<div class="details">Detailed small figure</div>
<div class="price">₹10</div>
<a class="btn" href="https://wa.me/919823847358?text=Hi%20Spider%20Model%20(%E2%82%B910)" target="_blank">WhatsApp</a>
</div>
</div>

</div>
</section>

<section id="contact">
<h2>Contact</h2>
<form action="https://wa.me/919823847358" target="_blank">
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Your Email" required>
<textarea placeholder="Your Message"></textarea>
<button class="btn">Send</button>
</form>
</section>

<footer>© 2025 Print3D</footer>

<script>
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",e=>{
 cursor.style.left=e.clientX+"px";
 cursor.style.top=e.clientY+"px";
});
function toggleTheme(){document.body.classList.toggle("light");}
</script>

</body>
</html>
